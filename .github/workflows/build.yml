name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install CDK dependencies
      run: npm ci

    - name: Install Lambda dependencies
      run: |
        cd lambda
        npm ci

    - name: Install Frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Lint CDK
      run: npm run build

    - name: Build Frontend
      run: |
        cd frontend
        npm run build

    - name: Run tests
      run: npm test